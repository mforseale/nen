name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python 3.10)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: sqlite://
      PACT_DEBUG: "false"
      PACT_COOKIE_SECURE: "false"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run API tests
        run: python -m unittest discover -s tests -v

      - name: Test deployment recovery and archive validation
        run: python -m unittest discover -s ../scripts/tests -v

      - name: Check VM script syntax
        run: bash -n ../scripts/setup-vm-services.sh ../scripts/setup-vm-caddy.sh ../scripts/setup-vm-backups.sh ../scripts/bootstrap-vm-migrations.sh ../scripts/setup-vm-cd.sh

  web:
    name: Web (Node 24)
    needs: api
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEN_API_ORIGIN: http://127.0.0.1:8000
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up runtime Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production website
        run: npm run build

      - name: Download Linux API wheels
        run: |
          python -m pip download --only-binary=:all: --dest ../.deploy/wheels -r ../api/requirements.txt

      - name: Package runtime
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python ../scripts/runtime_bundle.py --output ../.deploy/runtime --wheels ../.deploy/wheels --commit "$SOURCE_COMMIT"
          cp ../scripts/deploy_vm.py ../scripts/runtime_bundle.py ../docs/simple-deployment.md ../.deploy/runtime/

      - name: Boot and test the packed runtime
        run: |
          runtime_sha="$(cut -d ' ' -f 1 ../.deploy/runtime/nen-runtime.sha256)"
          python ../scripts/smoke_runtime.py ../.deploy/runtime/nen-runtime.tar.gz --sha256 "$runtime_sha"

      - name: Exercise VM deployment over restricted SSH
        run: |
          if ! test -x /usr/sbin/sshd || ! test -f /usr/lib/python3.10/ensurepip/__init__.py; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y openssh-server python3-venv
          fi
          runtime_sha="$(cut -d ' ' -f 1 ../.deploy/runtime/nen-runtime.sha256)"
          sudo env GITHUB_ACTIONS=true PATH="$PATH" /usr/bin/python3 ../scripts/ci_ssh_deploy.py ../.deploy/runtime/nen-runtime.tar.gz --sha256 "$runtime_sha"

      - name: Upload verified runtime
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nen-runtime-${{ github.sha }}
          path: .deploy/runtime/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
